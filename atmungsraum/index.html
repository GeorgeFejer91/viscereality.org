<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Atmungsraum | Viscereality</title>
  <link rel="stylesheet" href="./style.css?v=20261012-minimal">
  <script type="module" src="./app.js?v=20261012-minimal"></script>
</head>
<body>
  <main>
    <section class="screen" id="h10" aria-labelledby="sensor-status">
      <div class="sensor-header">
        <h1 id="sensor-status" tabindex="-1" role="status" data-measure>Suche Polar … (Demo)</h1>
        <button id="select-polar" hidden><span data-measure>Polar auswählen</span></button>
      </div>
      <div class="screen-body sensor-body">
        <figure class="ecg-box" hidden aria-label="ECG · Demo">
          <canvas id="ecg" aria-label="Simuliertes ECG für die UI-Demo"></canvas>
        </figure>
      </div>
      <footer class="actions">
        <button id="connect"><span data-measure>Erneut suchen</span></button>
        <a id="sensor-next" href="#runde" aria-disabled="true" tabindex="-1"><span data-measure>Weiter</span></a>
      </footer>
      <noscript>Für diese UI-Demo brauchst du JavaScript. Es ist kein echtes Headset verbunden.</noscript>
    </section>
    <section class="screen" id="runde" aria-labelledby="start-title" hidden>
      <h1 id="start-title" tabindex="-1" data-measure>Übung wählen</h1>
      <div class="screen-body round-body">
        <nav class="rounds" aria-label="Übungsart auswählen">
          <a class="round" href="#probe-runde" aria-labelledby="round-probe-label">
            <span id="round-probe-label" data-measure>Probe-Runde</span>
          </a>
          <a class="round" href="#haupt-runde" aria-labelledby="round-main-label">
            <span id="round-main-label" data-measure>Haupt-Runde</span>
          </a>
        </nav>
      </div>
    </section>
    <section class="screen" id="probe-runde" aria-labelledby="probe-title" hidden>
      <h1 id="probe-title" tabindex="-1" data-measure>Probe-Runde</h1>
      <div class="screen-body choices-body">
        <nav class="options" aria-label="Probe-Runde wählen">
          <a class="option" href="#start-probe-anleitung"><span><span data-measure>Anleitung</span><span class="option-hint" data-measure>Ohne Zeitlimit</span></span></a>
          <a class="option" href="#start-probe-5"><span data-measure>5 Minuten</span></a>
          <a class="option" href="#start-probe-10"><span data-measure>10 Minuten</span></a>
          <a class="option" href="#start-probe-15"><span data-measure>15 Minuten</span></a>
        </nav>
      </div>
      <footer class="actions"><a class="back" href="#runde"><span data-measure>← Zurück</span></a></footer>
    </section>
    <section class="screen" id="haupt-runde" aria-labelledby="haupt-title" hidden>
      <h1 id="haupt-title" tabindex="-1" data-measure>Haupt-Runde</h1>
      <div class="screen-body choices-body">
        <nav class="options" aria-label="Haupt-Runde wählen">
          <a class="option" href="#start-haupt-10"><span><span data-measure>10 Minuten</span><span class="option-hint" data-measure>5 Min. normal atmen</span><span class="option-hint" data-measure>5 Min. Box-Atmung</span></span></a>
          <a class="option" href="#start-haupt-15"><span><span data-measure>15 Minuten</span><span class="option-hint" data-measure>5 Min. normal atmen</span><span class="option-hint" data-measure>10 Min. Box-Atmung</span></span></a>
        </nav>
      </div>
      <footer class="actions"><a class="back" href="#runde"><span data-measure>← Zurück</span></a></footer>
    </section>
    <section class="screen" id="session-start" aria-labelledby="session-title" data-session-active="false" hidden>
      <h1 id="session-title" tabindex="-1" data-measure>Session starten</h1>
      <div class="screen-body play-body">
        <button id="play" data-action="start" class="play-button" aria-label="Starten">
          <svg width="64" height="64" viewBox="0 0 64 64" aria-hidden="true"><path d="M18 10 54 32 18 54Z" fill="currentColor"/></svg>
          <span data-measure>Starten</span>
        </button>
        <div class="session-progress">
          <p id="session-phase" data-measure>Bereit</p>
          <output id="session-time" aria-label="Verbleibende Zeit" data-measure></output>
        </div>
        <output id="start-status" aria-live="polite" data-measure hidden></output>
      </div>
      <footer class="actions">
        <a id="session-back" class="back" href="#probe-runde"><span data-measure>← Zurück</span></a>
      </footer>
    </section>
  </main>
</body>
</html>
